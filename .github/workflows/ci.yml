name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_estoque_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_estoque_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/controle_estoque_test?schema=public
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: admin12345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Apply migrations (test database)
        run: npm run prisma:migrate:deploy -w @controle/api
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
